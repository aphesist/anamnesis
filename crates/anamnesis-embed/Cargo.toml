[package]
name = "anamnesis-embed"
description = "anamnesis: embedding backends (local onnx, ollama, openai-compatible, hashing)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["local"]
# On-device ONNX inference through fastembed. ONNX Runtime binaries are fetched
# by `ort` at build time; model weights are downloaded on first use into the
# configured cache directory.
local = ["dep:fastembed"]
# Optional gpu execution providers for `local` (off by default; cpu is always the
# fallback when the provider cannot start). DirectML: any DirectX 12 gpu on windows, no
# extra install (the onnx runtime build ort downloads for windows already contains it).
gpu-directml = ["local", "dep:ort", "ort/directml"]
# CUDA: nvidia gpus on windows and linux. Needs the CUDA 13 runtime and cuDNN 9 installed;
# the provider libraries are copied next to the built binary.
gpu-cuda = ["local", "dep:ort", "ort/cuda", "ort/copy-dylibs"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
dirs = "6"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier", "json", "gzip"] }
fastembed = { version = "7.7", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"], optional = true }
# Only for the gpu features: must be the exact ort version fastembed pins.
ort = { version = "=2.0.0-rc.15", default-features = false, optional = true }

[dev-dependencies]
