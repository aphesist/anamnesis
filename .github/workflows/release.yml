name: release

# A `v*` tag builds and attaches to a github release:
#   - the desktop app (crates/anamnesis-desktop, tauri 2), built natively with the tauri
#     bundler: windows nsis setup.exe (per user) + msi, macos .dmg (arm64 and x86_64),
#     linux .deb + .AppImage. each bundle also installs the `anamnesis` command line
#     beside the app (as a tauri sidecar), for mcp clients and headless use;
#   - the `anamnesis` command line alone, as archives for every platform.
# `workflow_dispatch` builds the same files as workflow artifacts without releasing; given
# an existing `tag`, it builds that tag's source with this workflow and attaches the files
# to the tag's release (replacing files of the same name), for a release whose tag run
# failed for reasons outside the code.
#
# packaging/windows/build.sh (the mingw cross-build with a per-user msi and a portable
# zip) stays for local and offline builds; the native windows build replaces it here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: an existing v* tag to build and attach to its release (empty for artifacts only)
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # the tag being released: the pushed tag, or the dispatch input
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: cli (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            features: ""
          - name: macos-x86_64
            # cross-built on the arm runner. onnx runtime ships no prebuilt binaries for
            # intel macs, so this build has no on-device embeddings: it uses ollama or an
            # api embedder (see docs/install.md).
            os: macos-latest
            target: x86_64-apple-darwin
            features: --no-default-features --features embed-ui
          - name: linux-x86_64
            # the onnx runtime that ort links statically is built against glibc 2.38+
            # (it needs __isoc23_strtol): ubuntu 22.04 (glibc 2.35) cannot link it
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            features: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: build
        shell: bash
        run: cargo build --release --locked -p anamnesis-server --target ${{ matrix.target }} ${{ matrix.features }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG}"
          [[ "$version" == v* ]] || version="dev-${GITHUB_SHA::7}"
          name="anamnesis-${version}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          bin="target/${{ matrix.target }}/release/anamnesis"
          if [[ "${{ runner.os }}" == "Windows" ]]; then bin="$bin.exe"; fi
          cp "$bin" "dist/$name/"
          cp LICENSE NOTICE README.md "dist/$name/"
          cp docs/install.md "dist/$name/INSTALL.md"
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: anamnesis-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            cli_features: ""
            desktop_features: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            cli_features: ""
            desktop_features: ""
          - name: macos-x86_64
            # cross-built on the arm runner, without on-device embeddings (onnx runtime
            # ships no prebuilt library for intel macs; see docs/install.md)
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            cli_features: --no-default-features --features embed-ui
            desktop_features: --no-default-features
          - name: linux-x86_64
            # the onnx runtime that ort links statically is built against glibc 2.38+
            # (it needs __isoc23_strtol): ubuntu 22.04 (glibc 2.35) cannot link it
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            cli_features: ""
            desktop_features: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
      - name: linux libraries (webkitgtk, appindicator, rsvg)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file
      - name: tauri cli
        shell: bash
        run: cargo install tauri-cli --version "^2.12" --locked
      - name: the command line, as the bundles' sidecar
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p anamnesis-server --target ${{ matrix.target }} ${{ matrix.cli_features }}
          ext=""; [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          mkdir -p crates/anamnesis-desktop/binaries
          cp "target/${{ matrix.target }}/release/anamnesis$ext" \
            "crates/anamnesis-desktop/binaries/anamnesis-${{ matrix.target }}$ext"
      - name: build and bundle the app
        shell: bash
        working-directory: crates/anamnesis-desktop
        run: |
          cargo tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} \
            --config tauri.release.conf.json -- --locked ${{ matrix.desktop_features }}
      - name: collect
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG}"
          [[ "$version" == v* ]] || version="dev-${GITHUB_SHA::7}"
          b="target/${{ matrix.target }}/release/bundle"
          base="anamnesis-${version}-${{ matrix.name }}"
          mkdir -p dist
          shopt -s nullglob
          for f in "$b"/nsis/*-setup.exe; do cp "$f" "dist/$base-setup.exe"; done
          for f in "$b"/msi/*.msi; do cp "$f" "dist/$base.msi"; done
          for f in "$b"/dmg/*.dmg; do cp "$f" "dist/$base.dmg"; done
          for f in "$b"/deb/*.deb; do cp "$f" "dist/$base.deb"; done
          for f in "$b"/appimage/*.AppImage; do cp "$f" "dist/$base.AppImage"; done
          cd dist
          [[ -n "$(ls)" ]] || { echo "no bundles in $b" >&2; exit 1; }
          for f in *; do
            if command -v sha256sum > /dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: anamnesis-desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: github release
    needs: [build, desktop]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create the release and attach the archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --generate-notes --verify-tag
          fi
