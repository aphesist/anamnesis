name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: rust (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        # the default features include `local` embeddings: the ort crate downloads
        # the onnx runtime binaries at build time. model weights are never downloaded
        # in tests.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: rust test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: keep line endings as committed
        # some tests compare docs verbatim; git for windows would check them out as crlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: build
        run: cargo build --workspace --all-targets --locked
      - name: test
        # tests never touch the os keychain (they use the file store), never the
        # network and never download model weights
        env:
          ANAMNESIS_KEY_STORAGE: file
        run: cargo test --workspace --locked
      - name: gpu feature compiles (directml)
        if: runner.os == 'Windows'
        run: cargo check -p anamnesis-server --features gpu-directml --locked

  ui:
    name: ui (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: theme tokens are up to date
        run: node ui/theme/scripts/build-tokens.mjs --check
      - name: theme tests
        run: node --test ui/theme/test/*.test.mjs
      - name: app tests
        run: node --test ui/app/tests/*.test.mjs

  lab:
    name: lab (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: lab/uv.lock
      - name: test (offline, no extras)
        run: uv run --locked pytest
