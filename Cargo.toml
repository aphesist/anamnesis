[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/aphesist/anamnesis"
rust-version = "1.90"

[workspace.dependencies]
anamnesis-core = { path = "crates/anamnesis-core" }
anamnesis-connectors = { path = "crates/anamnesis-connectors" }
anamnesis-embed = { path = "crates/anamnesis-embed" }
anamnesis-mind = { path = "crates/anamnesis-mind" }
anamnesis-eval = { path = "crates/anamnesis-eval" }
anamnesis-harness = { path = "crates/anamnesis-harness" }
anamnesis-mcp = { path = "crates/anamnesis-mcp" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"

[profile.dev.package."*"]
opt-level = 2
